<!doctype html><html lang="en"><head><meta charset="utf-8"><title>FORMDAY self-test at phone width</title></head>
<body style="margin:0;background:#222;color:#eee;font:12px system-ui;padding:10px">
<iframe id="f" src="/?selftest=1" width="375" height="760" style="border:0"></iframe><pre id="out">running</pre>
<script>
const f = document.getElementById('f');
const poll = setInterval(() => { const p = f.contentDocument && f.contentDocument.getElementById('selftest'); if (p) { document.getElementById('out').textContent = 'width ' + f.contentWindow.innerWidth + '\n' + p.textContent; clearInterval(poll); } }, 500);
</script></body></html>
